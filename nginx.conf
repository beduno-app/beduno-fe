# LOCAL / LEGACY ONLY — this file does NOT serve production.
#
# Production SPA routing lives in CloudFront: see scripts/deploy/ and
# context/deployment/deploy-plan.md. CloudFront reproduces the try_files
# fallback below with a viewer-request function, and the /api/ proxy with a
# path-based cache behaviour. If you change routing here, that change does NOT
# reach production — and vice versa.
#
# This file is retained because it is still the only way to run the SPA and the
# JVM API behind one origin locally (beduno-be is not deployed to AWS yet).

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
